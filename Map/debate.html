<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheSkeptic · Debate Map</title>
<style>
:root {
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d3a4d;
  --text:#d6e0f0; --dim:#8b99b0; --accent:#58a6ff;
  --green:#3fb950; --amber:#d29922; --red:#f85149;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.wrap { max-width:1100px; margin:0 auto; padding:0 24px; }
header { padding:28px 0 20px; border-bottom:1px solid var(--border); margin-bottom:24px; }
h1 { margin:0 0 6px; font-size:1.5rem; letter-spacing:-0.01em; }
h1 .dot { color:var(--dim); }
.sub { color:var(--dim); font-size:0.92rem; margin:0 0 12px; }
.mono { font-family:var(--mono); font-size:0.88em; background:var(--panel2); border:1px solid var(--border); border-radius:5px; padding:1px 6px; }
.badge { display:inline-block; background:var(--panel2); border:1px solid var(--border);
  color:var(--accent); font-family:var(--mono); font-size:0.72rem; letter-spacing:0.06em;
  padding:3px 10px; border-radius:20px; margin:0 8px 6px 0; }
.badge.green { color:var(--green); }
.badge.amber { color:var(--amber); }
nav.topics { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 26px; }
nav.topics a { font-family:var(--mono); font-size:0.74rem; color:var(--dim);
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:4px 12px; text-decoration:none; }
nav.topics a:hover { color:var(--accent); border-color:var(--accent); }
.topic { background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:20px 22px; margin-bottom:22px; scroll-margin-top:16px; }
.thead { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.thead h2 { margin:0; font-size:1.1rem; display:flex; align-items:center; gap:10px; }
.thead .num { font-family:var(--mono); font-size:0.8rem; color:var(--accent);
  background:var(--panel2); border:1px solid var(--border); padding:2px 9px; border-radius:14px; }
.thead-b { color:var(--dim); font-size:0.78rem; font-family:var(--mono); }
.vs { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:820px) { .vs { grid-template-columns:1fr; } }
.colhead { font-family:var(--mono); font-size:0.7rem; letter-spacing:0.09em; margin-bottom:10px; padding:4px 10px; border-radius:6px; display:inline-block; }
.colhead.ms { color:var(--green); background:#12261e; border:1px solid #2a4d33; }
.colhead.cr { color:var(--amber); background:#262112; border:1px solid #4d3f1c; }
ul.pts { margin:0; padding:0; list-style:none; }
ul.pts li { padding:8px 12px 8px 30px; border:1px solid var(--border); border-radius:8px;
  background:var(--panel2); margin-bottom:8px; font-size:0.9rem; position:relative; }
ul.pts li::before { content:"✓"; position:absolute; left:11px; color:var(--green); font-size:0.8rem; }
details.counter { border:1px solid #4d3f1c; background:#211d12; border-radius:9px; margin-bottom:8px; }
details.counter summary { cursor:pointer; padding:9px 12px; font-size:0.92rem; font-weight:600;
  list-style:none; display:flex; align-items:center; gap:9px; }
details.counter summary::-webkit-details-marker { display:none; }
details.counter summary::before { content:"▸"; color:var(--amber); font-size:0.8rem; transition:transform .15s; }
details.counter[open] summary::before { transform:rotate(90deg); }
details.counter .cbody { padding:0 12px 12px 30px; }
details.counter .cbody p { margin:0 0 9px; font-size:0.88rem; }
.srcs { display:flex; flex-wrap:wrap; gap:6px; }
.chip { font-family:var(--mono); font-size:0.7rem; color:var(--dim); background:var(--panel2);
  border:1px solid var(--border); border-radius:12px; padding:2px 9px; }
a:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
.rebut { margin-top:18px; }
.rhead { font-family:var(--mono); font-size:0.7rem; letter-spacing:0.09em; color:var(--accent);
  background:#131c2b; border:1px solid #24344a; border-radius:6px; display:inline-block; padding:4px 10px; margin-bottom:10px; }
ul.rb { margin:0; padding:0; list-style:none; }
ul.rb li { padding:8px 12px 8px 30px; border-left:3px solid var(--green); background:#12261e;
  border-radius:0 8px 8px 0; margin-bottom:8px; font-size:0.9rem; position:relative; }
ul.rb li::before { content:"→"; position:absolute; left:11px; color:var(--green); }
.verdict { margin-top:18px; display:flex; gap:12px; align-items:baseline;
  padding:13px 16px; border-left:3px solid var(--red); background:#26151a; border-radius:0 8px 8px 0; font-size:0.92rem; }
.verdict .vlab { font-family:var(--mono); font-size:0.7rem; letter-spacing:0.09em; color:var(--red); flex:0 0 auto; }
footer { color:var(--dim); font-size:0.85rem; text-align:center; margin-top:36px; }
footer a { color:var(--accent); text-decoration:none; margin:0 8px; }
footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>TheSkeptic <span class="dot">·</span> Debate Map</h1>
  <p class="sub">Mainstream position vs. creationist counter — topic by topic, as it will run in the book. Rendered from <span class="mono">debates.js</span>. No hard-coded lists.</p>
  <div id="badges"></div>
</div></header>
<div class="wrap">
  <nav class="topics" id="nav"></nav>
  <div id="topics"></div>
  <footer>
    <a href="index.html">← Map</a><a href="Map.html">Dependency map →</a><a href="progress.html">Progress report →</a>
  </footer>
</div>
<script src="debates.js"></script>
<script>
(function () {
  var D = window.DEBATE_DATA;
  if (!D) {
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="padding:16px;text-align:center;color:#f85149">debates.js not found — nothing to render.</div>');
    return;
  }
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  var counters = 0, sources = 0, rebuttals = 0, points = 0;
  D.forEach(function (t) {
    points += t.mainstream.evidence.length;
    rebuttals += t.rebuttal.length;
    t.creationist.counters.forEach(function (c) { counters++; sources += c.sources.length; });
  });

  document.getElementById('badges').innerHTML =
    '<span class="badge">' + D.length + ' DEBATE TOPICS</span>' +
    '<span class="badge green">' + points + ' MAINSTREAM POINTS</span>' +
    '<span class="badge amber">' + counters + ' COUNTERS · ' + sources + ' SOURCES</span>' +
    '<span class="badge">' + rebuttals + ' REBUTTALS</span>';

  document.getElementById('nav').innerHTML = D.map(function (t, i) {
    return '<a href="#topic-' + i + '">' + pad(i + 1) + ' ' + esc(t.title) + '</a>';
  }).join('');

  document.getElementById('topics').innerHTML = D.map(function (t, i) {
    var evidence = t.mainstream.evidence.map(function (e) {
      return '<li>' + esc(e) + '</li>';
    }).join('');
    var cs = t.creationist.counters.map(function (c) {
      var srcs = c.sources.length
        ? '<div class="srcs">' + c.sources.map(function (s) {
            return '<span class="chip">' + esc(s) + '</span>';
          }).join('') + '</div>'
        : '';
      return '<details class="counter"><summary>' + esc(c.point) + '</summary>' +
        '<div class="cbody"><p>' + esc(c.detail) + '</p>' + srcs + '</div></details>';
    }).join('');
    var rb = t.rebuttal.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('');
    return '<section class="topic" id="topic-' + i + '">' +
      '<div class="thead"><h2><span class="num">' + pad(i + 1) + '</span>' + esc(t.title) + '</h2>' +
      '<span class="thead-b">' + t.mainstream.evidence.length + ' pts vs ' + t.creationist.counters.length + ' counters</span></div>' +
      '<div class="vs">' +
      '<div class="col"><div class="colhead ms">MAINSTREAM POSITION</div><ul class="pts">' + evidence + '</ul></div>' +
      '<div class="col"><div class="colhead cr">CREATIONIST POSITION</div>' + cs + '</div>' +
      '</div>' +
      '<div class="rebut"><div class="rhead">HOW THE BOOK ANSWERS</div><ul class="rb">' + rb + '</ul></div>' +
      '<div class="verdict"><span class="vlab">VERDICT</span><span>' + esc(t.verdict) + '</span></div>' +
      '</section>';
  }).join('');
})();
</script>
</body>
</html>
