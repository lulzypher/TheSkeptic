<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheSkeptic · Progress</title>
<style>
:root {
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d3a4d;
  --text:#d6e0f0; --dim:#8b99b0; --accent:#58a6ff;
  --green:#3fb950; --amber:#d29922;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.wrap { max-width:1100px; margin:0 auto; padding:0 24px; }
header { padding:28px 0 20px; border-bottom:1px solid var(--border); margin-bottom:24px; }
h1 { margin:0 0 6px; font-size:1.5rem; letter-spacing:-0.01em; }
h1 .dot { color:var(--dim); }
.sub { color:var(--dim); font-size:0.92rem; margin:0 0 12px; }
.badge { display:inline-block; background:var(--panel2); border:1px solid var(--border);
  color:var(--accent); font-family:var(--mono); font-size:0.72rem; letter-spacing:0.06em;
  padding:3px 10px; border-radius:20px; margin:0 8px 6px 0; }
.badge.green { color:var(--green); }
.badge.amber { color:var(--amber); }
.progress-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 22px; margin-bottom:22px; }
.progress-head { display:flex; justify-content:space-between; font-size:0.9rem; color:var(--dim); margin-bottom:8px; }
.progress-head b { color:var(--text); font-family:var(--mono); }
.bar { height:10px; background:var(--panel2); border-radius:5px; overflow:hidden; }
.bar .fill { height:100%; background:linear-gradient(90deg,#58a6ff,#3fb950); border-radius:5px; }
.section-bar { margin-bottom:14px; }
.section-head { display:flex; justify-content:space-between; font-size:0.88rem; color:var(--dim); margin-bottom:5px; }
.section-head b { font-family:var(--mono); color:var(--text); }
section { margin-bottom:26px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px 22px; }
h2 { margin:0 0 6px; font-size:1.05rem; }
.card .note { color:var(--dim); font-size:0.86rem; margin-bottom:16px; }
.sec-block { margin-bottom:20px; }
.sec-num { font-family:var(--mono); font-size:0.8rem; color:var(--accent); background:var(--panel2);
  border:1px solid var(--border); padding:2px 9px; border-radius:14px; margin-right:10px; }
ul.check { list-style:none; margin:0; padding:0; }
ul.check li { display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border:1px solid var(--border);
  border-radius:8px; background:var(--panel2); margin-bottom:7px; }
ul.check li .tick { flex:0 0 auto; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  font-size:0.68rem; margin-top:2px; }
li.done { border-color:#2a4d33; background:#14241b; }
li.done .tick { background:var(--green); color:#0d1117; }
li.draft { border-color:#4d3f1c; background:#211d12; }
li.draft .tick { background:var(--amber); color:#0d1117; }
li.planned .tick { background:#24344a; color:var(--accent); }
li .meta { font-family:var(--mono); font-size:0.74rem; color:var(--dim); }
.branches { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
.branch { border:1px solid var(--border); border-radius:10px; padding:14px 16px; background:var(--panel2); }
.branch b { font-size:0.95rem; }
.branch .why { font-size:0.82rem; color:var(--dim); margin:6px 0; }
.callout { padding:12px 16px; border-left:3px solid var(--accent); background:#131c2b; border-radius:0 8px 8px 0; font-size:0.9rem; }
.callout.green { border-color:var(--green); background:#12261e; }
.callout.amber { border-color:var(--amber); background:#262112; }
.mono { font-family:var(--mono); font-size:0.88em; background:var(--panel2); border:1px solid var(--border); border-radius:5px; padding:1px 6px; }
footer { color:var(--dim); font-size:0.85rem; text-align:center; margin-top:36px; }
footer a { color:var(--accent); text-decoration:none; margin:0 8px; }
footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>TheSkeptic <span class="dot">·</span> Progress</h1>
  <p class="sub">Status per section and per topic — every value pulled from <span class="mono">Map/data.js</span>.</p>
  <div id="badges"></div>
</div></header>
<div class="wrap">

  <div class="progress-card" id="progress"></div>

  <section><div class="card">
    <h2>Branches</h2>
    <div class="branches" id="branches"></div>
  </div></section>

  <section><div class="card">
    <h2>Section status</h2>
    <div class="note">A section counts as written only when every topic under it is <span class="mono">done</span>.</div>
    <div id="sections"></div>
  </div></section>

  <section><div class="card">
    <h2>What's actually written</h2>
    <div id="content"></div>
  </div></section>

  <section><div class="card">
    <h2>Status taxonomy</h2>
    <div id="taxonomy"></div>
  </div></section>

  <footer>
    <a href="index.html">Manuscript map →</a><a href="map.html">Dependency map →</a>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  var D = window.MANUSCRIPT_DATA;
  if (!D) {
    document.body.insertAdjacentHTML('afterbegin', '<div style="padding:16px;text-align:center;color:#f85149">Map/data.js not found — nothing to render.</div>');
    return;
  }
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var done = D.topics.filter(function (t) { return t.status === 'done'; }).length;
  var draft = D.topics.filter(function (t) { return t.status === 'draft'; }).length;
  var pct = Math.round(done / D.topics.length * 100);

  // Badges
  document.getElementById('badges').innerHTML =
    '<span class="badge green">' + done + '/' + D.topics.length + ' DONE</span>' +
    '<span class="badge amber">' + draft + ' DRAFT</span>' +
    '<span class="badge">' + (D.topics.length - done - draft) + ' PLANNED</span>' +
    '<span class="badge">CHAPTERS ' + D.chapters.filter(function (c) { return c.type === 'chapter'; }).length + '</span>';

  // Progress card: overall + per-section bars
  var prog = '<div class="progress-head"><span>Topics written</span><b>' + done + ' / ' + D.topics.length + ' (' + pct + '%)</b></div>' +
    '<div class="bar"><div class="fill" style="width:' + Math.max(pct, 3) + '%"></div></div>';
  D.structure.filter(function (s) {
    var n = parseInt(s.id, 10);
    return n >= 1 && n <= 6;
  }).forEach(function (s) {
    var secs = D.topics.filter(function (t) { return t.section === s.id; });
    var sd = secs.filter(function (t) { return t.status === 'done'; }).length;
    var sp = secs.length ? Math.round(sd / secs.length * 100) : 0;
    prog += '<div class="section-bar"><div class="section-head">' +
      '<span>' + esc(s.id) + ' · ' + esc(s.title) + '</span>' +
      '<b>' + sd + '/' + secs.length + '</b></div>' +
      '<div class="bar"><div class="fill" style="width:' + Math.max(sp, 0) + '%"></div></div></div>';
  });
  document.getElementById('progress').innerHTML = prog;

  // Branches
  document.getElementById('branches').innerHTML = D.branches.map(function (b) {
    var color = b.status === 'done' ? '#2a4d33' : b.status === 'draft' ? '#4d3f1c' : 'var(--border)';
    return '<div class="branch" style="border-color:' + color + '">' +
      '<b>' + esc(b.id) + ' · ' + esc(b.title) +
      ' <span class="meta" style="font-weight:400">[' + esc(b.status) + ']</span></b>' +
      '<p class="why">' + esc(b.why) + '</p>' +
      '<div style="font-size:0.82rem;color:var(--dim)">' + esc(b.notes) + '</div></div>';
  }).join('');

  // Section checklists
  var secHtml = '';
  D.structure.filter(function (s) {
    var n = parseInt(s.id, 10);
    return n >= 1 && n <= 6;
  }).forEach(function (s) {
    var secs = D.topics.filter(function (t) { return t.section === s.id; });
    secHtml += '<div class="sec-block"><div><span class="sec-num">' + esc(s.id) + '</span><b>' + esc(s.title) + '</b></div>';
    if (secs.length) {
      secHtml += '<ul class="check">' + secs.map(function (t) {
        var tick = t.status === 'done' ? '✓' : t.status === 'draft' ? '…' : '○';
        return '<li class="' + t.status + '"><span class="tick">' + tick + '</span><div>' +
          t.title + ' <span class="meta">' + t.id + ' · ' + t.status + '</span></div></li>';
      }).join('') + '</ul>';
    } else {
      secHtml += '<div class="note">No topics yet.</div>';
    }
    secHtml += '</div>';
  });
  document.getElementById('sections').innerHTML = secHtml;

  // What's written
  var written = D.topics.filter(function (t) { return t.status === 'done'; });
  document.getElementById('content').innerHTML =
    '<div class="callout green"><b>Written content:</b> <span class="mono">' +
    (written.length ? written.map(function (t) { return t.id; }).join(', ') : 'none yet') +
    '</span> — ' + written.length + ' of ' + D.topics.length + ' topics. ' +
    (done === 1 ? 'The manuscript is 1/' + D.topics.length + '. ' : 'The manuscript is ' + done + '/' + D.topics.length + '. ') +
    esc((D.structure.find(function (s) { return s.id === '0'; }) || { note: '' }).note) + '</div>';

  // Taxonomy
  document.getElementById('taxonomy').innerHTML = D.statusTaxonomy.map(function (s, i) {
    var cls = i === 0 ? 'green' : i === 1 ? 'amber' : '';
    return '<div class="callout ' + cls + '" style="margin:0 0 8px"><b>' + esc(s[0]) + '</b> — ' + esc(s[1]) + '</div>';
  }).join('');
})();
</script>
</body>
</html>
